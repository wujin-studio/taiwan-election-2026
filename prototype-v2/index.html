*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#faf9f6;color:#292b33;overflow:hidden}button{cursor:pointer;font:inherit}header{height:60px;padding:0 5%;background:#fff;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e8e2dc}header b{font-size:19px}header small{color:#bd7055}.home{height:calc(100dvh - 60px);display:grid;grid-template-columns:36% 64%}.intro{padding:9vh 5vw}.intro h1{font-size:clamp(40px,5vw,77px);letter-spacing:-3px;line-height:1.2}.intro em{color:#e77759;font-style:normal}.intro p{line-height:1.9;color:#81848b}.mapstage{position:relative;background:radial-gradient(ellipse,#eee8df,transparent 70%)}svg{width:100%;height:100%}.county{fill:#ddd9d2;stroke:white;stroke-width:1;vector-effect:non-scaling-stroke}.metro{fill:#b8b5c9;cursor:pointer;stroke:#fff;stroke-width:1.4;vector-effect:non-scaling-stroke}.metro:hover{fill:#ed9977}.label{font-size:13px;font-weight:900;paint-order:stroke;stroke:white;stroke-width:4;cursor:pointer}.quick{position:absolute;right:8px;bottom:10px;display:flex;gap:5px;flex-wrap:wrap;justify-content:end;max-width:75%}.quick button{border:1px solid #e5ddd5;border-radius:20px;padding:8px 10px;background:white;font-weight:800;font-size:12px}.status{position:absolute;left:8px;bottom:10px;font-size:11px;color:#8b827b;background:#fffdf9cc;padding:8px}.scene,.cityview{position:fixed;inset:0;z-index:20;background:#faf8f5;display:none}.scene.on,.cityview.on{display:block}.scene{background:radial-gradient(circle at 20% 20%,#f9ded3,transparent 48%),radial-gradient(circle at 80% 85%,#e6e2fc,transparent 52%),#faf8f5}.sceneTop{display:flex;justify-content:space-between;align-items:center;padding:18px 5%}.sceneTop button,.cityview header button{background:#fff;border:1px solid #ddd5cd;border-radius:25px;padding:9px 17px}.scene h2{font-size:clamp(32px,5vw,70px);letter-spacing:-2px;margin:15px 5% 5px}.scene .sub{font-size:12px;color:#9a8378;margin:0 5%}.cards{height:calc(100dvh - 225px);padding:22px 4% 45px;display:flex;gap:10px;align-items:stretch;justify-content:center;flex-wrap:wrap}.card{flex:1 1 180px;max-width:470px;min-width:0;padding:clamp(14px,2vw,30px);background:#fff0e7;border-radius:22px;box-shadow:0 24px 50px #685c5522;display:flex;flex-direction:column;justify-content:space-between;animation:pop .85s cubic-bezier(.17,.9,.22,1.3) both}.card:nth-child(2n){background:#ebe7ff}.card:nth-child(3n){background:#e9f0e9}.party{font-size:12px;color:#806f70;font-weight:800}.name{font-size:clamp(18px,2vw,30px);font-weight:900}.slogan{font-size:clamp(24px,3.4vw,53px);line-height:1.2;font-weight:900;overflow-wrap:anywhere}.source{font-size:11px;color:#8d8280}.next{position:absolute;right:5%;bottom:15px;background:#292c33;color:white;border:0;border-radius:25px;padding:13px 23px;font-weight:900}.blade{position:absolute;left:-20%;top:-20%;height:150%;width:4px;background:#f47b5d;transform:rotate(24deg);box-shadow:0 0 22px #f47b5d;animation:cut .8s forwards;pointer-events:none}.cityview{z-index:30}.cityview main{height:calc(100dvh - 60px);display:grid;grid-template-columns:35% 65%}.side{padding:6vh 5vw;border-right:1px solid #e7e0d8}.side h2{font-size:clamp(42px,6vw,84px);margin:12px 0}.tabs{display:flex;flex-direction:column;gap:8px;margin-top:35px}.tabs button{border:0;border-bottom:1px solid #e8e0d9;text-align:left;background:none;padding:12px 0;font-weight:900}.tabs button.active{color:#d57556}.content{padding:8vh 7vw;overflow:auto}.content h3{font-size:clamp(28px,4vw,50px)}.entry{padding:18px 0;border-bottom:1px solid #e8e0d9}.entry p{line-height:1.85;color:#82858c}@keyframes pop{0%{transform:translateY(100vh) scale(.65) rotate(-8deg);opacity:0}72%{transform:translateY(-22px) scale(1.08) rotate(1deg);opacity:1}85%{transform:translateY(8px) scale(.96)}100%{transform:none;opacity:1}}@keyframes cut{to{left:130%}}

</style><header><b>2026 選戰切一刀</b><small>ELECTION CUT / 7 REGIONS</small></header><div class="home"><div class="intro"><small>POLITICAL MARKETING ATLAS</small><h1>切開口號，<br>看見<em>選戰</em><br>的橫切面。</h1><p>點擊真實縣市地圖，讓候選人主打口號彈出並蓋滿畫面。</p></div><div class="mapstage"><svg id="map"></svg><div class="status" id="status">正在載入台灣行政區…</div><div class="quick" id="quick"></div></div></div><div class="scene" id="scene"><div class="blade"></div><div class="sceneTop"><b>ELECTION CUT 2026</b><button id="back">返回地圖 ×</button></div><h2 id="sceneTitle"></h2><p class="sub">各政黨候選人主推口號｜未核實口號明確標示</p><div class="cards" id="cards"></div><button class="next" id="next">切入城市分析 ↗</button></div><div class="cityview" id="cityview"><header><b>2026 選戰切一刀</b><button id="back2">返回地圖 ×</button></header><main><div class="side"><small>MARKETING CROSS SECTION</small><h2 id="cityTitle"></h2><p>城市需求 × 口號 × 媒體布局 × 數據證據</p><div class="tabs" id="tabs"></div></div><div class="content" id="content"></div></main></div><script>
const C=[['臺北','63000',['住宅','都更','交通'],[['蔣萬安','國民黨',null],['沈伯洋','民進黨','你的市長 沈伯洋']]],['新北','65000',['通勤','都更','公共建設'],[['李四川','國民黨',null],['蘇巧慧','民進黨',null]]],['桃園','68000',['航空城','產業','交通'],[['張善政','國民黨',null],['黃世杰','民進黨','心桃園 動起來']]],['臺中','66000',['交通','空品','產業'],[['江啟臣','國民黨',null],['何欣純','民進黨','市長換欣．台中創新！']]],['臺南','67000',['南科','文化','城鄉'],[['謝龍介','國民黨',null],['陳亭妃','民進黨',null]]],['高雄','64000',['半導體','亞灣','交通'],[['柯志恩','國民黨',null],['賴瑞隆','民進黨','南方崛起 邁向國際']]],['屏東','10013',['農漁','科技轉型','青年'],[['周春米','民進黨','做事拚未來！屏東亮起來！'],['蘇清泉','國民黨',null]]]];
let selected=0,tab=0;const scene=document.getElementById('scene'),cityview=document.getElementById('cityview');
function openCity(i){selected=i;const c=C[i];document.getElementById('sceneTitle').textContent=c[0]+'｜選戰發聲';const root=document.getElementById('cards');root.replaceChildren();c[3].forEach((p,j)=>{let d=document.createElement('div');d.className='card';d.style.animationDelay=(j*.16)+'s';[['party',p[1]],['name',p[0]],['slogan',p[2]||'主推口號待核實'],['source',p[2]?'公開競選標語；首發素材待核對':'尚無已核實的正式口號']].forEach(([cls,t])=>{let e=document.createElement('div');e.className=cls;e.textContent=t;d.append(e)});root.append(d)});scene.classList.remove('on');void scene.offsetWidth;scene.classList.add('on')}
function close(){scene.classList.remove('on');cityview.classList.remove('on')}
function enter(){scene.classList.remove('on');cityview.classList.add('on');tab=0;render()}
function render(){let c=C[selected],labels=['城市需求','候選人口號','媒體布局','民調證據','歷屆對照'];document.getElementById('cityTitle').textContent=c[0];const tabs=document.getElementById('tabs');tabs.replaceChildren();labels.forEach((s,i)=>{let b=document.createElement('button');b.textContent='╱ '+s;b.className=tab===i?'active':'';b.onclick=()=>{tab=i;render()};tabs.append(b)});const rows=tab===0?c[2].map(x=>[x,'城市需求研究主題，需對照公開統計與候選人政見。']):tab===1?c[3].map(x=>[x[0]+'｜'+(x[2]||'口號待核實'),x[1]+'；正式素材與發布日期需查證。']):tab===2?[['社群與新聞','以發布時間、原始素材及公開指標研究媒體布局。'],['實體活動','區分造勢、掃街與競總活動預告及實際執行。']]:tab===3?[['民調與事件','逐份核實機構、日期、樣本與問法，不以舊數據冒充最新。']]:[['歷屆比較','以中選會得票資料及官方競選素材比對。']];const root=document.getElementById('content');root.replaceChildren();let title=document.createElement('h3');title.textContent=labels[tab];root.append(title);rows.forEach(([a,b])=>{let d=document.createElement('div');d.className='entry';let strong=document.createElement('strong');strong.textContent=a;let p=document.createElement('p');p.textContent=b;d.append(strong,p);root.append(d)})}
document.getElementById('back').onclick=close;document.getElementById('back2').onclick=close;document.getElementById('next').onclick=enter;C.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c[0];b.onclick=()=>openCity(i);document.getElementById('quick').append(b)});
(async()=>{try{if(!window.d3||!window.topojson)throw Error('地圖函式庫未載入');let r=await fetch('./taiwan-counties.topo.json');if(!r.ok)throw Error('HTTP '+r.status);let topo=await r.json(),features=topojson.feature(topo,topo.objects.map).features;let fs=features.filter(f=>{let b=d3.geoBounds(f);return b[0][0]>119.2&&b[1][0]<123.4&&b[0][1]>21.5&&b[1][1]<26.3});let svg=d3.select('#map'),w=svg.node().clientWidth,h=svg.node().clientHeight;svg.attr('viewBox','0 0 '+w+' '+h);let proj=d3.geoMercator().fitExtent([[w*.13,h*.08],[w*.85,h*.92]],{type:'FeatureCollection',features:fs}),path=d3.geoPath(proj);svg.selectAll('path').data(fs).join('path').attr('d',path).attr('class',f=>'county'+(C.some(c=>c[1]===f.properties.id)?' metro':'')).on('click',(e,f)=>{let i=C.findIndex(c=>c[1]===f.properties.id);if(i>=0)openCity(i)});svg.selectAll('text').data(fs.filter(f=>C.some(c=>c[1]===f.properties.id))).join('text').attr('class','label').attr('x',f=>path.centroid(f)[0]).attr('y',f=>path.centroid(f)[1]).attr('text-anchor','middle').text(f=>C.find(c=>c[1]===f.properties.id)[0]).on('click',(e,f)=>openCity(C.findIndex(c=>c[1]===f.properties.id)));document.getElementById('status').textContent='真實縣市界線｜點選七縣市'}catch(e){document.getElementById('status').textContent='地圖載入錯誤：'+e.message+'；可使用縣市按鈕'}})();
</script></html>
