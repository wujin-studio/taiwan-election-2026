<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選戰解碼 2026｜Election Decode</title><script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js'></script><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script><style>:root{--paper:#f8f7f2;--ink:#232631;--orange:#ef7452;--violet:#8575dd}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans','Noto Sans TC',sans-serif;overflow:hidden}button{font:inherit;cursor:pointer}header{height:68px;background:#fffdf9;display:flex;align-items:center;justify-content:space-between;padding:0 4%;border-bottom:1px solid #e9e5df}header b{font-size:20px}header span{font-size:11px;letter-spacing:1.5px;color:#b56a55}.layout{height:calc(100dvh - 68px);display:grid;grid-template-columns:35% 65%}.intro{padding:8vh 5vw 20px;position:relative;z-index:1}.ey{font-size:12px;font-weight:900;letter-spacing:2px;color:#c66c52}.intro h1{font-size:clamp(42px,5.4vw,85px);line-height:1.14;letter-spacing:-3px;margin:25px 0}.intro h1 em{font-style:normal;color:var(--orange)}.intro p{line-height:2;color:#81848e;max-width:390px}.intro .small{font-size:12px;color:#aa8474;margin-top:30px}.mapstage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#efe6d9 0%,#f8f7f2 64%)}.mapstage:before{content:'';position:absolute;inset:10%;background-image:linear-gradient(#d8d1c34d 1px,transparent 1px),linear-gradient(90deg,#d8d1c34d 1px,transparent 1px);background-size:38px 38px;transform:perspective(600px) rotateX(55deg);mask-image:radial-gradient(ellipse,black,transparent 75%)}#map{width:100%;height:100%;position:relative}.base{fill:#dedbd3;stroke:white;stroke-width:1;vector-effect:non-scaling-stroke}.city{fill:#b9b6b1;stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .3s}.city:hover{fill:#afa2e4}.city.active{fill:#ef936b}.side{fill:#a57966;stroke:none;pointer-events:none}.mapname{font-size:14px;font-weight:900;fill:#252a36;paint-order:stroke;stroke:#fffdf9;stroke-width:4;stroke-linejoin:round;cursor:pointer}.status{position:absolute;left:20px;bottom:18px;font-size:11px;background:#ffffffdd;padding:10px 15px;color:#8a7e72}.sheet{position:fixed;right:0;top:68px;bottom:0;width:min(510px,95vw);background:#fffefa;z-index:10;box-shadow:-25px 0 70px #55453630;transform:translateX(105%);transition:transform .6s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}.sheet.open{transform:translateX(0)}.sheethead{padding:26px 28px 15px;border-bottom:1px solid #eee7de}.sheethead .top{display:flex;justify-content:space-between;align-items:center}.sheethead h2{font-size:43px;letter-spacing:-2px;margin:8px 0}.close{border:1px solid #ddd7cf;border-radius:50%;background:white;width:38px;height:38px;font-size:22px}.tabs{display:flex;overflow-x:auto;border-bottom:1px solid #eee8df;padding:6px 16px}.tabs button{border:0;background:none;white-space:nowrap;padding:14px 13px;font-size:13px;font-weight:800;color:#898a90}.tabs button.active{border-bottom:3px solid var(--orange);color:#292c36}.body{overflow:auto;flex:1;padding:25px 28px}.body h3{font-size:24px}.body p{font-size:14px;line-height:1.9;color:#7a7e87}.story{padding:20px 0;border-bottom:1px solid #ede6dc}.story strong{font-size:18px}.switch{display:flex;gap:6px;flex-wrap:wrap;padding:12px 22px;border-top:1px solid #e9e3d9}.switch button{border:1px solid #e5ddd3;border-radius:24px;background:white;padding:7px 12px;font-size:12px}.switch button.active{background:#2c2e37;color:white}.hint{font-size:12px;color:#a18a79}.error{color:#b45147}@media(max-width:820px){header{height:56px}.layout{height:calc(100dvh - 56px);display:block}.intro{position:absolute;top:56px;left:0;padding:18px;pointer-events:none}.intro h1{font-size:35px;margin:9px 0}.intro p,.intro .small{display:none}.intro .ey{font-size:10px}.mapstage{height:100%}.sheet{top:auto;bottom:0;width:100%;height:72dvh;border-radius:22px 22px 0 0;transform:translateY(105%)}.sheet.open{transform:translateY(0)}.sheethead{padding:13px 22px}.sheethead h2{font-size:30px;margin:4px 0}.body{padding:16px 22px}.status{bottom:6px;left:7px;font-size:10px}}@media(prefers-reduced-motion:reduce){.sheet,.city{transition:none!important}}</style><style>
:root{--paper:#fbfaf7;--ink:#272930;--orange:#eb785e;--violet:#978be5}
body{background:var(--paper)}header{background:#fff;border-bottom:1px solid #eae8e5}
header b{letter-spacing:-.7px}.mapstage{background:radial-gradient(ellipse at 52% 48%,#f0ede9 0%,#fbfaf7 69%)}
.mapstage:before{background-size:45px 45px;opacity:.34}.base{fill:#e4e2dc}.city{fill:#a8b8b3}.city:hover{fill:#a69ee5}.city.active{fill:#f09c82}.side{fill:#a29cbd}
.sheet{background:#fff;box-shadow:-25px 0 70px #56515d22}.sheethead{border-color:#eeeae5}
.tabs button.active{border-color:#ec816a;color:#292c35}.ey{color:#d36f59}
.intro h1 em{color:#e9785b}.intro .small{color:#928b95}
.story{border-color:#efede8}.story strong{letter-spacing:-.3px}
.graphButtons{display:flex;gap:7px;margin:14px 0 18px;flex-wrap:wrap}
.graphButtons button{border:1px solid #e7e3e1;background:#fff;border-radius:20px;padding:8px 13px;font-size:12px}
.graphButtons button.on{background:#292c34;color:white}
.chartBox{position:relative;height:260px;margin:16px 0}
.sourceLine{font-size:11px;color:#8a8c92;line-height:1.8}
.sourceLine a{color:#bf6c54}
</style></head><body><header><b>選戰解碼 <span>2026</span></b><span>ELECTION DECODE / RESEARCH PREVIEW</span></header><div class="layout"><section class="intro"><div class="ey">YOUTHFUL GEOGRAPHIC STORYTELLING</div><h1>選戰，<br>從<em>城市</em><br>開始。</h1><p>六都不只是六組民調，而是六種城市命題。點擊真實行政區，城市抬升，立即探索候選人如何透過口號、政見與媒體回應選民需求。</p><div class="small">CLICK A CITY / RAISE THE MAP / READ THE STORY</div></section><div class="mapstage"><svg id="map" role="img" aria-label="真實台灣縣市行政區互動立體地圖"></svg><div class="status" id="status">正在載入真實行政區界線…</div></div></div><aside class="sheet" id="sheet"><div class="sheethead"><div class="top"><span class="ey">CITY FOCUS / POLITICAL MARKETING</span><button class="close" onclick="closeCity()" aria-label="關閉">×</button></div><h2 id="title"></h2><span class="hint">城市條件 → 政治品牌 → 媒體布局 → 數據佐證</span></div><div class="tabs" id="tabs"></div><div class="body" id="body"></div><div class="switch" id="switch"></div></aside><script>
const C=[['臺北','63000',['蔣萬安','沈伯洋'],['住宅負擔','城市治理','交通通勤']],['新北','65000',['李四川','蘇巧慧'],['跨區通勤','都市更新','公共建設']],['桃園','68000',['張善政','黃世杰'],['航空城','產業聚落','人口成長']],['臺中','66000',['江啟臣','何欣純'],['交通路網','空氣品質','產業發展']],['臺南','67000',['謝龍介','陳亭妃'],['南科擴張','文化觀光','城鄉均衡']],['高雄','64000',['柯志恩','賴瑞隆'],['半導體產業','亞灣轉型','交通建設']]];
const tabs=['城市脈絡','政治品牌','媒體布局','資料分析','歷屆比較'];let current=0,tab=0,features=[],layer,path,svg=d3.select('#map');const code=f=>String(f.properties.id||f.properties.COUNTYCODE||'');
function draw(){let c=C[current];document.getElementById('title').textContent=c[0];document.getElementById('tabs').innerHTML=tabs.map((t,i)=>'<button class="'+(tab===i?'active':'')+'" onclick="tab='+i+';draw()">'+t+'</button>').join('');document.getElementById('switch').innerHTML=C.map((x,i)=>'<button class="'+(i===current?'active':'')+'" onclick="openCity('+i+')">'+x[0]+'</button>').join('');const b=document.getElementById('body');
if(tab===0)b.innerHTML='<div class="ey">CONTEXT / NEEDS / RESPONSE</div><h3>城市需求，如何成為政治訴求？</h3>'+c[3].map((v,i)=>'<div class="story"><strong>0'+(i+1)+' / '+v+'</strong><p>以城市客觀條件、公開統計與候選人正式政策逐項對照；此處為研究主題，尚未將推論視為候選人主張。</p></div>').join('');
if(tab===1)b.innerHTML='<div class="ey">CANDIDATE BRAND</div><h3>候選人政治品牌</h3>'+c[2].map(n=>'<div class="story"><strong>'+n+'</strong><p>正式口號原文、首發日期、主視覺及政策主張待逐筆驗證；不以分析者自擬標語替代官方口號。</p></div>').join('');
if(tab===2)b.innerHTML='<div class="ey">MEDIA CHANNELS</div><h3>媒體與活動矩陣</h3>'+['社群影音與貼文','新聞與政策記者會','街頭行程與造勢'].map(v=>'<div class="story"><strong>'+v+'</strong><p>比較渠道、素材、發布時間、可取得的觸及與互動數據。無公開資料時不估計投放金額或成效。</p></div>').join('');
if(tab===3)b.innerHTML='<div class="ey">EVIDENCE</div><h3>民調與重大事件</h3><div class="story"><strong>資料驗證中</strong><p>需核對原始調查報告、日期、樣本與方法後，才能建立事件與民調的互動時間軸。</p></div>';
if(tab===4)b.innerHTML='<div class="ey">ELECTION HISTORY</div><h3>2022 → 2026</h3><div class="story"><strong>歷屆得票及口號</strong><p>以中選會正式選票資料及候選人原始競選素材建檔，分辨城市需求、政治品牌的延續與轉變。</p></div>'}
function openCity(i){current=i;tab=0;document.getElementById('sheet').classList.add('open');draw();focus(i)}
function closeCity(){document.getElementById('sheet').classList.remove('open');if(layer)layer.transition().duration(600).attr('transform',null)}
function focus(i){if(!layer)return;const f=features.find(x=>code(x)===C[i][1]);if(!f)return;let b=path.bounds(f),cx=(b[0][0]+b[1][0])/2,cy=(b[0][1]+b[1][1])/2;const w=svg.node().clientWidth,h=svg.node().clientHeight,k=1.12;layer.transition().duration(850).attr('transform','translate('+(w/2-k*cx)+','+(h/2-k*cy)+') scale('+k+')');layer.selectAll('path.city').classed('active',d=>d===f);layer.selectAll('g.extrusion').transition().duration(500).attr('transform',d=>d===f?'translate(-10,-19)':'translate(0,0)')}
async function init(){try{const r=await fetch('./taiwan-counties.topo.json');if(!r.ok)throw Error('地圖資源無法讀取');const t=await r.json();features=topojson.feature(t,t.objects.map).features;const mainland=features.filter(f=>{let b=d3.geoBounds(f);return b[0][0]>119.2&&b[1][0]<123.4&&b[0][1]>21.5&&b[1][1]<26.3});const w=svg.node().clientWidth,h=svg.node().clientHeight;svg.attr('viewBox','0 0 '+w+' '+h);let proj=d3.geoMercator().fitExtent([[w*.2,h*.1],[w*.8,h*.92]],{type:'FeatureCollection',features:mainland});path=d3.geoPath(proj);layer=svg.append('g');layer.selectAll('path.base').data(mainland).join('path').attr('class','base').attr('d',path);const metros=mainland.filter(f=>C.some(c=>c[1]===code(f)));const groups=layer.selectAll('g.extrusion').data(metros).join('g').attr('class','extrusion');groups.each(function(f){let g=d3.select(this);for(let n=12;n>=1;n-=2)g.append('path').attr('d',path(f)).attr('class','side').attr('transform','translate('+(n*.55)+','+(n*.9)+')');g.append('path').datum(f).attr('class','city').attr('d',path).on('click',(e,d)=>openCity(C.findIndex(c=>c[1]===code(d))))});layer.selectAll('text.mapname').data(metros).join('text').attr('class','mapname').attr('x',d=>path.centroid(d)[0]).attr('y',d=>path.centroid(d)[1]-8).attr('text-anchor','middle').text(d=>C.find(c=>c[1]===code(d))[0]).on('click',(e,d)=>openCity(C.findIndex(c=>c[1]===code(d))));document.getElementById('status').textContent='真實縣市界線 × 六都立體抬升　／　點擊城市';}catch(e){document.getElementById('status').textContent='圖資載入失敗：'+e.message+'（不顯示假地圖）';document.getElementById('status').classList.add('error')}}init();
</script><script>
const analytics=[
{city:'臺北',issues:['住宅負擔','都市更新','交通'],channels:['社群','新聞','活動']},
{city:'新北',issues:['通勤','都更','公共建設'],channels:['社群','新聞','活動']},
{city:'桃園',issues:['航空城','產業','交通'],channels:['社群','新聞','活動']},
{city:'臺中',issues:['捷運','空氣品質','產業'],channels:['社群','新聞','活動']},
{city:'臺南',issues:['南科','文化','城鄉'],channels:['社群','新聞','活動']},
{city:'高雄',issues:['半導體','亞灣','交通'],channels:['社群','新聞','活動']}
];let chartInstance=null;
function chartPanel(){
const b=document.getElementById('body'),c=analytics[current];
b.innerHTML='<div class="ey">INTERACTIVE EVIDENCE LAB</div><h3>數據是證據，不是結論。</h3><p>切換圖表檢視城市研究議題、媒體指標與民調紀錄。未取得可核實的原始數據時，不產生虛構的支持率或聲量。</p><div class="graphButtons"><button class="on" data-graph="topics">城市議題</button><button data-graph="media">媒體渠道</button><button data-graph="poll">民調波段</button></div><div class="chartBox"><canvas id="researchChart"></canvas></div><div id="chartExplain" class="story"></div><p class="sourceLine">資料狀態：研究架構示範。城市議題是分類標籤，非統計占比。正式資料需附日期、來源與樣本。</p>';
b.querySelectorAll('[data-graph]').forEach(x=>x.onclick=()=>{b.querySelectorAll('[data-graph]').forEach(y=>y.classList.toggle('on',y===x));showGraph(x.dataset.graph)});
showGraph('topics');
}
function showGraph(type){
if(chartInstance){chartInstance.destroy();chartInstance=null}
const c=analytics[current],ex=document.getElementById('chartExplain');
let labels=[],values=[],title='',explain='';
if(type==='topics'){labels=c.issues;values=[1,1,1];title='城市研究議題（非量化）';explain='此圖只表示三項待研究的城市議題，不表示需求比例。下一階段將以城市統計、調查及候選人政見建立真正的議題分布。'}
if(type==='media'){labels=c.channels;values=[0,0,0];title='媒體資料蒐集狀態';explain='目前尚無同口徑、可核對的公開媒體觸及或投放數字。圖表顯示零筆已驗證紀錄，不代表候選人沒有使用該媒體。'}
if(type==='poll'){labels=['已驗證時間序列'];values=[0];title='民調時間序列待建檔';explain='必須取得同一機構、相容問法的多期調查，才能比較波段；新聞事件的時間先後不能直接推論因果。'}
ex.innerHTML='<strong>'+title+'</strong><p>'+explain+'</p>';
chartInstance=new Chart(document.getElementById('researchChart'),{type:type==='poll'?'line':'bar',data:{labels,datasets:[{label:type==='topics'?'研究主題標記':type==='media'?'已驗證紀錄數':'民調觀測',data:values,backgroundColor:['#e98770','#a99bdf','#a5bcb4'],borderColor:'#e98770',borderWidth:2,borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>type==='topics'?'待研究議題（非數量）':type==='media'?'已驗證資料 0 筆':'尚無已驗證序列'}}},scales:{y:{display:type!=='topics',beginAtZero:true,grid:{color:'#f0eeeb'}},x:{grid:{display:false},ticks:{color:'#70757c'}}}}});
}
const previousDraw=draw;draw=function(){if(chartInstance){chartInstance.destroy();chartInstance=null}previousDraw();if(tab===3)chartPanel()};
</script></body></html>
