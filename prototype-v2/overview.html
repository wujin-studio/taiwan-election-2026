<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>27 位參選人總表｜2026 選戰切一刀</title>
<meta name="description" content="2026 地方選舉 8 個選區、27 位參選人的政黨、主口號、主視覺與民調，一頁看完。">
<meta name="build" content="v20-2026-10-18">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css?b=v20">
<style>
.wrap{padding:clamp(22px,4vw,48px) var(--gut) 80px;max-width:1440px;margin:0 auto}
.wrap>h1{font:900 clamp(34px,5.4vw,72px)/1.1 var(--serif);margin:0 0 10px}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:14px 0 26px;font-size:13px;color:var(--ink-2)}
table.all{width:100%;border-collapse:collapse;font-size:14px}
.all thead th{text-align:left;font:800 13px/1.3 var(--sans);color:var(--mute);padding:10px 12px;border-bottom:2px solid var(--ink)}
.all td{padding:14px 12px;border-bottom:1px solid var(--rice);vertical-align:top;line-height:1.6}
.all tr.rg td{padding:26px 12px 8px;border-bottom:1px solid var(--ink)}
.all tr.rg h2{margin:0;font:900 26px/1.2 var(--serif);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.all tr.rg h2 a{font:700 13px/1 var(--sans);color:var(--terra);text-decoration:none}
.all tr.rg h2 small{font:500 13px/1 var(--sans);color:var(--mute)}
.who{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;min-width:260px}
.ph{width:52px;height:64px;border-radius:10px;overflow:hidden;background:var(--paper-2);display:grid;place-items:center;font:900 22px/1 var(--serif);color:var(--mute)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.who b{font:900 19px/1.2 var(--serif);margin-right:8px}
.who .sl{display:block;margin-top:6px;font:900 18px/1.35 var(--sans);word-break:keep-all}
.who .sl.none{font:500 14px/1.4 var(--sans);color:var(--mute)}
.subs{font-size:13px;color:var(--ink-2);max-width:22em}
.vis img{width:110px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--rice)}
.vis .none{font-size:12.5px;color:var(--mute)}
.poll b{font:900 20px/1 var(--serif)}
.poll .note{display:block}
.polltbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
.polltbl th,.polltbl td{border-bottom:1px solid var(--rice);padding:9px 10px;text-align:left;vertical-align:top}
.polltbl thead th{font:800 12.5px/1.3 var(--sans);color:var(--mute);border-bottom:2px solid var(--ink)}
.qt{display:inline-block;font:800 11px/1 var(--sans);padding:4px 7px;border-radius:5px;background:var(--ink);color:#fff}
.qt.alt{background:var(--lav)}
.md{display:inline-block;font:700 11px/1 var(--sans);padding:4px 7px;border-radius:5px;background:#eef1f4;color:var(--slate)}
.md.on{background:#efeaf6;color:#5d4f8a}
details.opt{margin-top:30px;border:1.5px dashed var(--rice-2);border-radius:var(--r-m);padding:14px 18px;background:#fff}
details.opt summary{cursor:pointer;font-weight:800}
@media (max-width:900px){
  .all thead{display:none}
  .all,.all tbody,.all tr,.all td{display:block;width:100%}
  .all tr.c{background:#fff;border:1px solid var(--rice);border-radius:var(--r-m);margin:10px 0;padding:6px 0}
  .all tr.c td{border:0;padding:6px 14px}
  .all tr.c td[data-l]::before{content:attr(data-l);display:block;font:700 11.5px/1.4 var(--sans);color:var(--mute);margin-bottom:2px}
  .all tr.rg td{padding:22px 2px 6px}
  .who{min-width:0}
  .vis img{width:100%;height:auto;max-height:160px;object-fit:contain;background:var(--paper-2)}
  .polltbl thead{display:none}.polltbl,.polltbl tbody,.polltbl tr,.polltbl td{display:block;width:100%}
  .polltbl tr{border-bottom:1px solid var(--rice);padding:8px 0}.polltbl td{border:0;padding:2px 0}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="2026 選戰切一刀 首頁"><span class="mark" aria-hidden="true"></span>2026 選戰切一刀</a>
  <nav aria-label="主要"><a class="pill" href="./">回地圖</a></nav>
</header>
<main class="wrap" id="app"><p class="note">正在載入總表…</p></main>
<script src="assets/js/core.js?b=v20"></script>
<script>
(async()=>{
const {esc,st,srcs,party,fmt}=EC;const app=document.getElementById('app');
let db;try{db=await EC.loadDB()}catch(e){app.textContent=e.message;return}
const ORDER=['taipei','new-taipei','taoyuan','taichung','tainan','kaohsiung','pingtung','pingtung-city'];
const Q=db.questionTypes;
const latest=(c,mode)=>db.polls.filter(p=>p.region===c.region&&p.mode===mode&&p.question==='vote'&&p.results[c.id]!=null).sort((a,b)=>b.end.localeCompare(a.end))[0];
const pc=(c,mode)=>{const p=latest(c,mode);return p?`<b>${p.results[c.id]}%</b> ${st(p.status)}${srcs(p.src)}<span class="note">${esc(p.pollster)}｜${p.end}</span>`:`<span class="note">${mode==='phone'&&db.pollGaps[c.region]?'未找到公開民調':'—'}</span>`};
const row=c=>{const none=c.slogan.status==='missing';const v=c.visuals[0];
 return `<tr class="c"><td data-l="參選人｜政黨｜主口號"><div class="who">${c.photo?`<div class="ph"><img src="${c.photo.file}" alt="${esc(c.name)}" loading="lazy"></div>`:`<div class="ph" aria-label="照片缺漏">${esc(c.name[0])}</div>`}<div><b>${esc(c.name)}</b>${party(c.party)}${c.incumbent?' <span class="note">現任</span>':''}<span class="sl ${none?'none':''}">${esc(none?'未見正式口號':c.slogan.text)}</span>${none?'':`${st(c.slogan.status)}${srcs(c.slogan.src)}`}</div></div></td>
 <td data-l="次口號" class="subs">${c.subSlogans.slice(0,3).map(s=>esc(s.text)).join('<br>')||'—'}</td>
 <td data-l="主視覺" class="vis">${v?`<img src="${v.file}" alt="${esc(v.caption)}" loading="lazy"><div class="note">${esc(v.kind)}</div>`:`<span class="none">${c.major?'原圖缺漏':'—'}</span>`}</td>
 <td data-l="最新電話民調（投票支持）" class="poll">${pc(c,'phone')}</td>
 <td data-l="最新網路問卷（非機率）" class="poll">${pc(c,'online-panel')}</td></tr>`};
app.innerHTML=`<h1>27 位參選人總表</h1><p class="lede">8 個選區一次全部列出：姓名、政黨和主口號放在同一欄。民調和城市頁讀同一個資料庫；電話調查和網路問卷分開列，自願網路投票只放附錄。</p>
<div class="legendrow">${['verified','unverified','missing'].map(s=>`${st(s)} ${esc(db.meta.status[s])}`).join('<br>')}</div>
<div class="scroll-x"><table class="all"><thead><tr><th style="width:34%">參選人｜政黨｜主口號</th><th>次口號</th><th>主視覺</th><th>最新電話民調<br>（投票支持）</th><th>最新網路問卷<br>（非機率）</th></tr></thead><tbody>
${ORDER.map(id=>{const r=db.region[id];return `<tr class="rg"><td colspan="5"><h2>${esc(r.name)}${r.office}<small>${r.candidates.length} 人｜戶籍人口 ${fmt(r.population.value)}（${r.population.date}）</small><a href="city.html?r=${id}">看城市分析</a></h2></td></tr>`+r.candidates.map(cid=>row(db.cand[cid])).join('')}).join('')}
</tbody></table></div>
<section style="margin-top:56px"><h2 class="h-l">全部民調</h2><p class="lede">不同機構、題型、方法的結果不能直接當成趨勢。題型：${Object.values(Q).join('、')}。</p>
<div class="scroll-x"><table class="polltbl"><thead><tr><th>選區</th><th>機構／委託</th><th>日期</th><th>方法／樣本／誤差</th><th>題型</th><th>結果</th><th>狀態</th></tr></thead><tbody>
${[...db.polls].sort((a,b)=>ORDER.indexOf(a.region)-ORDER.indexOf(b.region)||b.end.localeCompare(a.end)).map(p=>`<tr><td><b>${esc(db.region[p.region].short)}</b></td><td>${esc(p.pollster)}<br><span class="note">委託：${esc(p.commissioner)}</span></td><td>${p.start}–${p.end.slice(5)}</td><td><span class="md ${p.mode!=='phone'?'on':''}">${esc(db.modes[p.mode])}</span><br>${esc(p.method)}｜n=${fmt(p.sample)}｜${p.margin?'±'+p.margin:'誤差不適用'}</td><td><span class="qt ${p.question!=='vote'?'alt':''}">${esc(Q[p.question])}</span></td><td>${Object.entries(p.results).map(([id,v])=>`${esc(db.cand[id].name)} <b>${v}%</b>`).join('<br>')}${p.undecided!=null?`<br><span class="note">未決定 ${p.undecided}%</span>`:''}</td><td>${st(p.status)}${srcs(p.src)}</td></tr>`).join('')}
${Object.entries(db.pollGaps).map(([id,t])=>`<tr><td><b>${esc(db.region[id].short)}</b></td><td colspan="5">${esc(t)}</td><td>${st('missing')}</td></tr>`).join('')}
</tbody></table></div>
<details class="opt"><summary>附錄：自願網路投票（不具代表性）</summary><p class="note">${esc(db.optIn.warning)}｜${esc(db.optIn.source)}｜${db.optIn.dates} ${st(db.optIn.status)}${srcs(db.optIn.src)}</p>
<table class="polltbl"><tbody>${db.optIn.results.map(o=>`<tr><td><b>${esc(db.region[o.region].short)}</b></td><td>${Object.entries(o.r).map(([id,v])=>esc(db.cand[id].name)+' '+v+'%').join('、')}</td><td class="note">${fmt(o.n)} 票</td></tr>`).join('')}</tbody></table></details></section>
<p class="note" style="margin-top:40px">${esc(db.meta.neutrality)}｜資料更新 ${db.meta.asOf}｜版本 ${EC.BUILD}｜舊版（V19）保留於 <a href="v19-overview.html">v19-overview.html</a></p>`;
})();
</script>
</body>
</html>
