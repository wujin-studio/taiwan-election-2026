<!doctype html><html lang='zh-Hant'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>2026 台灣六都選舉情報站</title><style>body{font-family:system-ui;background:#0b1628;color:#eaf5ff;margin:0;padding:5vw}h1{font-size:clamp(28px,5vw,54px)}section{background:#172a43;border-radius:20px;padding:24px;margin:20px 0}button{background:#30c9c5;border:0;padding:12px;border-radius:10px;margin:5px;cursor:pointer}p{line-height:1.8;color:#bbd0df}</style><h1>2026 台灣六都選舉｜政治行銷情報站</h1><p>民調波段・競選口號・政見・媒體攻防・城市議題</p><div id='buttons'></div><section id='panel'></section><section><h2>民調資料標準</h2><p>最新民調須註明調查日期、發布日期、機構、樣本、抽樣方式與誤差；未查證數據不作為即時結果展示。競選口號須保留原始來源。</p><a style='color:#5fe5df' href='https://www.cec.gov.tw/'>中央選舉委員會</a></section><script>let data={'台北':'住宅、交通、城市治理','新北':'通勤、人口、都市更新','桃園':'航空城、科技、人口成長','台中':'交通、空污、產業','台南':'南科、交通、城鄉均衡','高雄':'半導體、亞灣、淨零轉型'};function show(k){document.getElementById('panel').innerHTML='<h2>'+k+'市長選戰</h2><p>城市主要議題：'+data[k]+'</p><p>最新民調：待逐份來源驗證與建檔</p><p>競選口號與媒體事件：待逐項查核</p>'}document.getElementById('buttons').innerHTML=Object.keys(data).map(k=>'<button onclick="show(\''+k+'\')">'+k+'</button>').join('');show('台北')</script></html>
