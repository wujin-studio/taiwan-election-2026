in(530px,94vw);z-index:8;background:#fffefa;box-shadow:-20px 0 70px #6a5c4a2c;transform:translateX(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}.panel.open{transform:translateX(0)}.panelHead{padding:24px 27px 15px;border-bottom:1px solid #e9e2d8}.panelHead .row{display:flex;justify-content:space-between;align-items:center}.ey{font-size:11px;color:#b66b50;letter-spacing:2px;font-weight:900}.panelHead h2{font-size:40px;margin:10px 0}.close{background:white;border:1px solid #ddd4c8;border-radius:50%;width:40px;height:40px;font-size:24px;cursor:pointer}.tabs{display:flex;overflow:auto;padding:9px 20px;border-bottom:1px solid #eee8de;gap:3px}.tabs button{white-space:nowrap;border:0;background:none;padding:12px 13px;font:700 13px 'Noto Sans TC';color:#87878a;cursor:pointer}.tabs button.active{color:#bd6447;border-bottom:3px solid #bd6447}.body{overflow:auto;flex:1;padding:25px 28px}.body h3{font-size:23px}.body p{color:#777f86;line-height:1.9;font-size:14px}.story{border-bottom:1px solid #eee6dc;padding:18px 0}.story strong{font-size:18px}.cities{display:flex;gap:6px;flex-wrap:wrap;padding:12px 23px;border-top:1px solid #e9e2d8}.cities button{background:white;border:1px solid #e5ded4;border-radius:25px;padding:7px 11px;cursor:pointer}.cities button.active{background:#282d35;color:white}.note{font-size:12px;color:#a47b64}.pollbar{height:11px;background:#eee9e2;border-radius:20px;margin:10px 0 18px}.pollbar i{display:block;height:100%;background:#d77755;border-radius:20px}@media(max-width:850px){header{height:55px}.layout{height:calc(100dvh - 55px);display:block}.intro{position:absolute;top:55px;left:0;z-index:1;padding:13px 18px;pointer-events:none}.intro h1{font-size:30px;margin:8px 0}.intro p{display:none}.intro small{font-size:9px}.map{height:100%}.panel{top:auto;bottom:0;height:73dvh;width:100%;border-radius:24px 24px 0 0;transform:translateY(105%)}.panel.open{transform:translateY(0)}.panelHead{padding:12px 20px}.panelHead h2{font-size:30px;margin:4px 0}.body{padding:15px 22px}.tabs{padding:5px 12px}.status{font-size:10px;bottom:8px;left:8px}}@media(prefers-reduced-motion:reduce){.panel{transition:none}}</style><script src="prototype-v2/assets/js/analytics.js?b=v20"></script></head><body><header><b>六都選戰圖鑑 2026</b><span>TAIWAN / ELECTION ATLAS</span></header><main class="layout"><div class="intro"><small>GEO-SPATIAL ELECTION INTELLIGENCE</small><h1>六都選戰，<br><em>從城市</em>開始。</h1><p>點擊真實縣市邊界，行政區抬升、鏡頭聚焦，立即閱讀城市需求、候選人、政治口號、媒體布局與民調證據。</p></div><div class="map"><svg id="map" role="img" aria-label="台灣行政區精確邊界與六都立體抬升互動地圖"></svg><div class="status" id="status">正在載入真實縣市邊界…</div></div></main><aside class="panel" id="panel"><div class="panelHead"><div class="row"><span class="ey">CITY INTELLIGENCE / 2026</span><button class="close" aria-label="關閉面板" onclick="closePanel()">×</button></div><h2 id="cityTitle"></h2><div class="note">城市需求 × 候選人敘事 × 媒體策略</div></div><div class="tabs" id="tabs"></div><div class="body" id="body"></div><div class="cities" id="cities"></div></aside><script>
const cities=[{n:'臺北',id:'63000',people:['蔣萬安','沈伯洋'],issues:['居住負擔','交通治理','都市更新']},{n:'新北',id:'65000',people:['李四川','蘇巧慧'],issues:['跨區通勤','公共建設','都市更新']},{n:'桃園',id:'68000',people:['張善政','黃世杰'],issues:['航空城','科技產業','人口成長']},{n:'臺中',id:'66000',people:['江啟臣','何欣純'],issues:['交通路網','空氣品質','產業投資']},{n:'臺南',id:'67000',people:['謝龍介','陳亭妃'],issues:['南科擴張','文化觀光','城鄉均衡']},{n:'高雄',id:'64000',people:['柯志恩','賴瑞隆'],issues:['半導體聚落','亞灣轉型','交通建設']}];
let current=0,tab=0,geoFeatures=[],path,layer,svg=d3.select('#map'),projection,selectedShape;const names=['行銷脈絡','候選人與口號','媒體布局','民調證據','歷屆對照'];
function openCity(i){current=i;tab=0;document.getElementById('panel').classList.add('open');drawPanel();focusMap(i)}
function closePanel(){document.getElementById('panel').classList.remove('open');if(layer)layer.transition().duration(600).attr('transform',null)}
function drawPanel(){let c=cities[current];document.getElementById('cityTitle').textContent=c.n;document.getElementById('tabs').innerHTML=names.map((n,i)=>'<button class="'+(i===tab?'active':'')+'" onclick="tab='+i+';drawPanel()">'+n+'</button>').join('');document.getElementById('cities').innerHTML=cities.map((x,i)=>'<button class="'+(i===current?'active':'')+'" onclick="openCity('+i+')">'+x.n+'</button>').join('');let b=document.getElementById('body');
if(tab===0)b.innerHTML='<span class="ey">CITY CONTEXT</span><h3>城市條件 → 選民需求 → 政策回應</h3>'+c.issues.map((x,i)=>'<div class="story"><strong>0'+(i+1)+' / '+x+'</strong><p>此為城市研究議題，須以人口、住宅、交通及產業公開統計，與候選人具日期的政策內容進行交叉比對。尚未取得資料前，不將分析假設當作事實。</p></div>').join('');
if(tab===1)b.innerHTML='<span class="ey">CANDIDATE BRAND</span><h3>候選人與競選口號</h3>'+c.people.map(n=>'<div class="story"><strong>'+n+'</strong><p>正式口號、競選主視覺、首次發布日期及政見來源：待核實。一般社群貼文不視為正式競選口號。</p></div>').join('');
if(tab===2)b.innerHTML='<span class="ey">CHANNEL STRATEGY</span><h3>媒體布局與執行成效</h3>'+['新聞與政策發布','社群貼文及短影音','競總、街頭與造勢活動'].map(x=>'<div class="story"><strong>'+x+'</strong><p>分析素材主張、發布日期、使用媒介與可驗證成效；缺少曝光、觸及及投放費用時，不估計宣傳力度。</p></div>').join('');
if(tab===3)b.innerHTML='<span class="ey">POLLING EVIDENCE</span><h3>民調資料查核</h3><p>最新民調需逐份確認調查期間、機構、樣本、問卷、誤差與委託來源。此版不顯示未重新核實的數字。</p><div class="story"><strong>歷史波段</strong><p>僅將有明確調查時間及來源的民調納入；不同機構不可直接拼成同一趨勢。</p></div>';
if(tab===4)b.innerHTML='<span class="ey">HISTORICAL CONTEXT</span><h3>2022 vs 2026</h3><div class="story"><strong>歷屆正式得票</strong><p>以中選會正式資料為基礎建立選票結構。</p></div><div class="story"><strong>跨屆口號對照</strong><p>以候選人官方素材與發布時間比對政治品牌延續與改變。</p></div>'}
function focusMap(i){if(!layer||!geoFeatures.length)return;const feat=geoFeatures.find(f=>String(f.properties.id||f.properties.COUNTYCODE)===cities[i].id);if(!feat)return;const b=path.bounds(feat),cx=(b[0][0]+b[1][0])/2,cy=(b[0][1]+b[1][1])/2;const width=svg.node().clientWidth,height=svg.node().clientHeight;const k=1.15;layer.transition().duration(800).attr('transform','translate('+(width/2-k*cx)+','+(height/2-k*cy)+') scale('+k+')');layer.selectAll('.metro').classed('active',d=>d===feat).attr('filter',d=>d===feat?'drop-shadow(10px 18px 2px #967d67)':'none').transition().duration(550).attr('transform',d=>d===feat?'translate(-9,-15)':null)}
async function init(){try{const url='https://raw.githubusercontent.com/jason2506/Taiwan.TopoJSON/master/topojson/counties.json';const res=await fetch(url);if(!res.ok)throw Error('HTTP '+res.status);const topology=await res.json();const obj=topology.objects.map||topology.objects.counties||Object.values(topology.objects)[0];geoFeatures=topojson.feature(topology,obj).features;const code=f=>String(f.properties.id||f.properties.COUNTYCODE||'');if(!geoFeatures.some(f=>code(f)==='63000'))throw Error('行政區代碼欄位不符');const bounds=geoFeatures.filter(f=>{let b=d3.geoBounds(f);return b[0][0]>119.3&&b[1][0]<123.4&&b[0][1]>21.5&&b[1][1]<26.3});const w=svg.node().clientWidth,h=svg.node().clientHeight;svg.attr('viewBox','0 0 '+w+' '+h);projection=d3.geoMercator().fitExtent([[w*.18,h*.08],[w*.83,h*.92]],{type:'FeatureCollection',features:bounds});path=d3.geoPath(projection);layer=svg.append('g');layer.selectAll('path').data(bounds).join('path').attr('d',path).attr('class',d=>cities.some(c=>c.id===code(d))?'metro':'base').on('click',(e,d)=>{let i=cities.findIndex(c=>c.id===code(d));if(i>=0)openCity(i)});layer.selectAll('text').data(bounds.filter(f=>cities.some(c=>c.id===code(f)))).join('text').attr('class','cityLabel').attr('x',d=>path.centroid(d)[0]).attr('y',d=>path.centroid(d)[1]).attr('text-anchor','middle').text(d=>cities.find(c=>c.id===code(d)).n).on('click',(e,d)=>openCity(cities.findIndex(c=>c.id===code(d))));document.getElementById('status').textContent='行政區真實邊界｜點選六都可聚焦及抬升';}catch(e){document.getElementById('status').textContent='地圖載入失敗：'+e.message+'。未使用不精確的替代圖形。';}}
init();</script></body></html>
